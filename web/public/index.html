<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2c313b;
    --text: #e6e8ec;
    --muted: #939aa8;
    --accent: #8ab4f8;
    --ok: #7fbf8f;
    --warn: #d8a657;
    /* Mana colours, shared by the pips and the stacked mana bars. */
    --W: #f8f2dc;
    --U: #9fd4ee;
    --B: #b6aca8;
    --R: #f0a08a;
    --G: #98ccac;
    --C: #ccc2bf;
  }
  * { box-sizing: border-box; }
  /* display:grid on .columns/.stats would otherwise beat the UA [hidden] rule. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .row + .row { margin-top: 8px; }
  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  select, label, button { font: inherit; }
  select {
    background: var(--bg); color: var(--text); max-width: 62vw;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    /* iOS ignores padding on a native select, so set the height directly;
       16px keeps Safari from zooming when the control is focused. */
    min-height: 36px; font-size: 16px; appearance: none; -webkit-appearance: none;
  }
  .meta { color: var(--muted); }
  /* Comfortable tap targets on a phone: the whole label is the target. */
  label {
    color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
    min-height: 34px; padding: 0 2px;
  }
  input[type=checkbox] { width: 22px; height: 22px; }

  .tabs { display: flex; gap: 6px; }
  .tabs button {
    background: transparent; color: var(--muted); cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  .tabs button[aria-selected=true] {
    background: var(--bg); color: var(--text); border-color: var(--accent);
  }

  main { padding: 12px; }
  .columns {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    align-items: start;
  }
  @media (min-width: 700px) {
    .columns { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
  }
  .cat h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 8px;
    padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .cat h2 span { color: var(--muted); font-weight: 400; }

  /* Stacked cards: a card is ~140% as tall as it is wide, so overlapping by
     112% leaves each card's name/mana line visible, like Archidekt. */
  .stack { position: relative; }
  .stack:not(.stacked) { display: grid; gap: 10px; }
  .card { position: relative; display: block; cursor: pointer; }
  .card img {
    display: block; width: 100%; border-radius: 4.75% / 3.5%;
    background: #0d0f12;
    /* Reserve the card's shape before the lazy image arrives, so scrolling
       doesn't reflow the stack under the reader. */
    aspect-ratio: 488 / 680;
  }
  .stack.stacked .card { margin-bottom: -112%; }
  .stack.stacked .card:last-child { margin-bottom: 0; }
  /* Tapping a card opens it in place: it keeps its position and the rest of the
     stack slides down below it. Tapping it again closes the stack back up.
     Opening makes room for the whole card rather than raising it, so a closed
     card is never left painting over its neighbours. */
  .stack.stacked .card.open { margin-bottom: 0; }
  /* Only the strip you can actually see is tappable: in a stack the next card
     covers the rest, so a tap on a covered area must belong to the card drawn
     on top of it, not the one underneath. An open card is tappable all over. */
  .card { pointer-events: none; }
  .hit {
    position: absolute; inset: 0; pointer-events: auto;
    background: transparent; border: 0; padding: 0; cursor: pointer;
  }
  .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stack.stacked .hit { bottom: 80%; }
  .stack.stacked .card:last-child .hit,
  .stack.stacked .card.open .hit { bottom: 0; }
  /* Hovering lifts a card clear of the stack, so a mouse can peek at one
     without opening it. A mouse only: a finger leaves :hover behind after the
     tap, so this would outlive the tap and leave a closed card covering the
     stack below it — which reads as "it never closed". The media query rules
     out touch-primary devices; `html.touch`, set from the last pointer event,
     rules out the finger on a device that also has a mouse. */
  @media (hover: hover) and (pointer: fine) {
    html:not(.touch) .card:has(.hit:hover) { z-index: 3; }
  }

  /* Details (printing, price, otags) for the card that's open. */
  .info {
    position: absolute; top: 4%; right: 5%; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.82); color: #fff; font-size: 15px; font-weight: 700;
    /* Hidden but focusable order-wise only when its card is open. */
    visibility: hidden;
  }
  .card.open .info { visibility: visible; }
  .card.open .qty { right: calc(5% + 36px); }
  .card .qty {
    position: absolute; top: 4%; right: 5%;
    background: rgba(0,0,0,.82); color: #fff;
    border-radius: 10px; padding: 1px 7px; font-size: 12px; font-weight: 600;
  }
  /* An edge stripe rather than a badge: a badge sat on top of the card name,
     which is the one line you can read in a stack. */
  .card .buy {
    position: absolute; top: 3%; bottom: 3%; left: 0; width: 5px;
    border-radius: 3px; background: var(--warn);
  }
  .missing {
    aspect-ratio: 488 / 680; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--muted);
  }
  #empty { color: var(--muted); }

  /* Tapping a card opens it in an overlay: touch screens have no hover, and an
     overlay changes no layout, so the stack keeps its scroll position. */
  #preview {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(8,9,12,.86);
  }
  #preview.open { display: flex; }
  #preview .sheet {
    max-width: 380px; width: 100%; max-height: 100%; overflow-y: auto;
  }
  #preview img, #preview .missing { width: 100%; border-radius: 12px; }
  #preview .text {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--panel); white-space: pre-wrap;
    color: var(--muted); font-size: 13px;
  }
  #preview .text b { color: var(--text); font-size: 14px; }
  #preview .tags { color: var(--accent); font-size: 12px; }

  /* Stats tab */
  .stats {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    align-items: start;
  }
  .stats section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .stats h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
  }
  .stat-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
    align-items: center; padding: 3px 0;
  }
  .stat-row .label { display: flex; align-items: center; gap: 6px; }
  .stat-row .num { font-variant-numeric: tabular-nums; }
  .bar {
    grid-column: 1 / -1; height: 4px; border-radius: 2px;
    background: var(--line); overflow: hidden;
  }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .bar.ok > span { background: var(--ok); }
  .bar.warn > span { background: var(--warn); }
  .pip {
    width: 17px; height: 17px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #1a1a1a;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  }
  /* Mana is one stacked bar per question — the split between colours is the
     whole point, and five separate bars made it something you had to add up. */
  .mana-bar {
    display: flex; height: 12px; border-radius: 6px;
    overflow: hidden; background: var(--line); margin: 2px 0 8px;
  }
  .mana-bar > span { display: block; height: 100%; }
  /* One rule per colour for both the pips and the bar segments, so a colour
     can't end up meaning two different things in the same section. */
  .pip.W, .mana-bar .W { background: var(--W); }
  .pip.U, .mana-bar .U { background: var(--U); }
  .pip.B, .mana-bar .B { background: var(--B); }
  .pip.R, .mana-bar .R { background: var(--R); }
  .pip.G, .mana-bar .G { background: var(--G); }
  .pip.C, .mana-bar .C { background: var(--C); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; }
  .legend > span {
    display: inline-flex; align-items: center; gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  .legend i { color: var(--muted); font-style: normal; font-size: 12px; }
  .mana-line + .mana-line { margin-top: 14px; }
  .mana-line > .head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 8px; color: var(--muted); font-size: 12px;
  }
  .mana-line > .head b { color: var(--text); font-size: 13px; font-weight: 600; }

  /* Wants & trades tab — the one view that writes anything. It borrows the
     card grid from the deck view (.columns/.cat/.stack), so a wanted card
     looks exactly like the same card in a deck. */
  .bar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar-row + .bar-row { margin-top: 10px; }
  #wants .columns { margin-top: 14px; }
  button.action {
    background: var(--panel); color: var(--text); cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 14px; min-height: 36px;
  }
  button.action:disabled { opacity: .5; cursor: default; }
  button.action.on { border-color: var(--accent); color: var(--accent); }
  .field {
    background: var(--bg); color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    /* 16px, like the selects: anything smaller makes Safari zoom on focus. */
    min-height: 36px; font-size: 16px; min-width: 0;
  }
  #want-name { flex: 3 1 190px; }
  #want-note { flex: 2 1 150px; }
  #want-count { width: 74px; }
  .err { color: var(--warn); }
  /* Remove sits opposite the details button, in the strip of the card that
     stays visible in a stack. Only rendered while the list is unlocked. */
  .card .del {
    position: absolute; top: 4%; left: 5%; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.82); color: var(--R); font-size: 17px; line-height: 1;
  }
  .card button.qty {
    border: 0; font: inherit; font-size: 12px; font-weight: 600;
    pointer-events: auto; cursor: pointer;
  }

  /* Password prompt. Above #preview, so it is never opened behind a card. */
  #unlock {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    padding: 16px; background: rgba(8,9,12,.86);
  }
  #unlock.open { display: flex; }
  #unlock form {
    display: grid; gap: 10px; width: 100%; max-width: 320px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  #unlock h3 { margin: 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Decks</h1>
    <select id="deck" class="deck-only"></select>
    <span class="meta" id="count"></span>
  </div>
  <div class="row">
    <div class="tabs" role="tablist">
      <button id="tab-cards" role="tab" aria-selected="true">Cards</button>
      <button id="tab-stats" role="tab" aria-selected="false">Stats</button>
      <button id="tab-wants" role="tab" aria-selected="false">Wants</button>
    </div>
    <select id="group" class="deck-only" title="group cards by" aria-label="group cards by">
      <option value="type">by type</option>
      <option value="category">by category</option>
    </select>
    <label><input type="checkbox" id="stacked" checked> stack</label>
    <label class="deck-only"><input type="checkbox" id="drafts"> drafts</label>
  </div>
</header>

<main>
  <div class="columns" id="board"></div>
  <div class="stats" id="stats" hidden></div>
  <!-- Wants & trades: a standalone list, deliberately unconnected to the decks. -->
  <section id="wants" hidden>
    <div class="bar-row">
      <button type="button" id="wants-edit" class="action">Edit</button>
      <span class="meta" id="wants-status"></span>
    </div>
    <form class="bar-row" id="wants-add" hidden>
      <input class="field" id="want-name" list="want-names" autocomplete="off"
             placeholder="card name" aria-label="card name" required>
      <datalist id="want-names"></datalist>
      <input class="field" id="want-count" type="number" min="1" max="99" value="1"
             aria-label="how many">
      <select class="field" id="want-list" aria-label="which list">
        <option value="want">want</option>
        <option value="trade">for trade</option>
      </select>
      <input class="field" id="want-note" maxlength="200"
             placeholder="note (optional)" aria-label="note">
      <button type="submit" id="want-add" class="action on">Add</button>
    </form>
    <div class="columns" id="wants-board"></div>
  </section>
  <p id="empty" class="deck-only"></p>
</main>

<div id="preview" role="dialog" aria-modal="true" aria-label="card details">
  <div class="sheet"></div>
</div>

<div id="unlock" role="dialog" aria-modal="true" aria-label="unlock editing">
  <form id="unlock-form">
    <h3>Password to edit the list</h3>
    <input class="field" id="unlock-password" type="password" autocomplete="current-password"
           aria-label="password" required>
    <span class="meta err" id="unlock-error"></span>
    <div class="bar-row">
      <button type="submit" class="action on">Unlock</button>
      <button type="button" id="unlock-cancel" class="action">Cancel</button>
    </div>
  </form>
</div>

<script>
const board = document.getElementById('board');
const statsEl = document.getElementById('stats');
const deckSel = document.getElementById('deck');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const stackedEl = document.getElementById('stacked');
const draftsEl = document.getElementById('drafts');
const groupEl = document.getElementById('group');
const preview = document.getElementById('preview');
const tabs = {cards: document.getElementById('tab-cards'),
              stats: document.getElementById('tab-stats'),
              wants: document.getElementById('tab-wants')};
let index = [];
let TYPE_ORDER = ['Commander', 'Creature', 'Planeswalker', 'Instant', 'Sorcery',
                  'Artifact', 'Enchantment', 'Battle', 'Other', 'Land'];
const COLORS = ['W', 'U', 'B', 'R', 'G', 'C'];

// Which input is actually in use, for the hover lift below. The media query
// alone isn't enough: a hybrid device — a touchscreen laptop, an iPad with a
// trackpad — reports hover:hover/pointer:fine for its *primary* pointer while
// you tap the screen with a finger, and the finger still leaves :hover behind.
for (const type of ['pointerover', 'pointerdown']) {
  addEventListener(type, e => document.documentElement.classList.toggle(
    'touch', e.pointerType !== 'mouse'), {capture: true, passive: true});
}

// --- grouping ---

function groupKey(card, mode) {
  if (card.category === 'Commander') return 'Commander';
  return mode === 'type' ? (card.type || 'Other') : card.category;
}

function sortedGroups(cards, mode) {
  const groups = new Map();
  for (const c of cards) {
    const key = groupKey(c, mode);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  for (const list of groups.values()) {
    list.sort((a, b) => (a.cmc ?? 0) - (b.cmc ?? 0) || a.name.localeCompare(b.name));
  }
  const total = list => list.reduce((n, c) => n + c.count, 0);
  // Commander first, Land last; type mode keeps the conventional type order,
  // category mode falls back to biggest group first.
  const rank = key => key === 'Commander' ? -1 : key === 'Land' ? 1 : 0;
  const typeIdx = key => (TYPE_ORDER.indexOf(key) + 1) || TYPE_ORDER.length;
  return [...groups.entries()].sort((a, b) => {
    if (rank(a[0]) !== rank(b[0])) return rank(a[0]) - rank(b[0]);
    if (mode === 'type') return typeIdx(a[0]) - typeIdx(b[0]);
    return total(b[1]) - total(a[1]) || a[0].localeCompare(b[0]);
  });
}

// --- cards ---

function imageOrPlaceholder(card, src) {
  const placeholder = () => {
    const d = document.createElement('div');
    d.className = 'missing';
    d.textContent = card.name;
    return d;
  };
  if (!src) return placeholder();
  const img = document.createElement('img');
  img.src = src;
  img.alt = card.name;
  img.loading = 'lazy';
  // Scryfall image URLs are versioned and can rot.
  img.onerror = () => img.replaceWith(placeholder());
  return img;
}

// `edit` is only passed by the wants & trades tab, and only while it's
// unlocked: {onRemove} adds a remove button, {onDrop} makes the quantity badge
// take one copy off.
function cardEl(card, edit = {}) {
  const el = document.createElement('div');
  el.className = 'card';
  el.append(imageOrPlaceholder(card, card.image));
  // A button, so the card is reachable by keyboard as well as by tap.
  const hit = document.createElement('button');
  hit.type = 'button';
  hit.className = 'hit';
  hit.title = card.buy ? `${card.name} — on the buy list` : card.name;
  hit.setAttribute('aria-expanded', 'false');
  hit.onclick = () => toggleOpen(el, hit);
  el.append(hit);
  if (card.count > 1) {
    const droppable = Boolean(edit.onDrop);
    const q = document.createElement(droppable ? 'button' : 'span');
    q.className = 'qty';
    q.textContent = card.count + '×';
    if (droppable) {
      q.type = 'button';
      q.title = `remove one copy of ${card.name}`;
      q.onclick = e => { e.stopPropagation(); edit.onDrop(); };
    }
    el.append(q);
  }
  if (edit.onRemove) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.title = `remove ${card.name}`;
    del.setAttribute('aria-label', `remove ${card.name}`);
    del.onclick = e => { e.stopPropagation(); edit.onRemove(); };
    el.append(del);
  }
  if (card.buy) {
    const b = document.createElement('span');
    b.className = 'buy';
    b.title = 'on the buy list';  // stripe only: text here would cover the name
    el.append(b);
  }
  const info = document.createElement('button');
  info.type = 'button';
  info.className = 'info';
  info.textContent = 'i';
  info.title = `${card.name} details`;
  info.tabIndex = -1;  // only reachable once its card is open
  info.onclick = e => { e.stopPropagation(); openPreview(card, info); };
  el.append(info);
  return el;
}

// Each card toggles on its own: opening one only pushes the cards after it down,
// so the tapped card — and everything above it — never moves. Auto-closing a
// card higher up would shift the page under the reader's finger instead.
function toggleOpen(el, hit) {
  const open = el.classList.toggle('open');
  hit.setAttribute('aria-expanded', String(open));
  el.querySelector('.info').tabIndex = open ? 0 : -1;
}

let previewOpener = null;

function openPreview(card, opener) {
  const sheet = preview.firstElementChild;
  sheet.innerHTML = '';
  sheet.append(imageOrPlaceholder(card, card.image));

  // The image already shows name/type/oracle, so the panel below adds only what
  // it can't: printing, price, otags — and the rules text when there's no image.
  const text = document.createElement('div');
  text.className = 'text';
  const title = document.createElement('b');
  title.textContent = `${card.name} ${card.mana_cost || ''}`.trim();
  text.append(title);
  const facts = [
    card.count > 1 ? `${card.count} copies` : null,
    card.set ? `${card.set.toUpperCase()} ${card.number || ''}`.trim() : null,
    card.foil ? 'foil' : null,
    card.price_eur ? `€${card.price_eur}` : null,
    card.buy ? 'on the buy list' : null,
    card.list === 'want' ? 'wanted' : card.list === 'trade' ? 'for trade' : null,
    card.note || null,
  ].filter(Boolean);
  if (facts.length) text.append('\n' + facts.join(' · '));
  if (!card.image) {
    text.append('\n' + [card.type_line, card.oracle_text].filter(Boolean).join('\n'));
  }
  if (card.otags?.length) {
    const tags = document.createElement('div');
    tags.className = 'tags';
    tags.textContent = card.otags.join(' · ');
    text.append('\n', tags);
  }
  sheet.append(text);
  preview.classList.add('open');
  previewOpener = opener || null;
  sheet.tabIndex = -1;
  sheet.focus();
}

function closePreview() {
  if (!preview.classList.contains('open')) return;
  preview.classList.remove('open');
  if (previewOpener) previewOpener.focus();  // back to the button that opened it
  previewOpener = null;
}
// Any tap on the overlay closes it, including on the card itself — tapping
// twice should never leave a card stuck open.
preview.onclick = closePreview;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePreview();
});

function renderCards(deck) {
  board.innerHTML = '';
  const cards = deck.commander ? [deck.commander, ...deck.cards] : deck.cards;
  for (const [cat, list] of sortedGroups(cards, groupEl.value)) {
    const col = document.createElement('section');
    col.className = 'cat';
    const h = document.createElement('h2');
    h.textContent = cat + ' ';
    const n = document.createElement('span');
    n.textContent = `(${list.reduce((sum, c) => sum + c.count, 0)})`;
    h.append(n);
    const stack = document.createElement('div');
    stack.className = 'stack' + (stackedEl.checked ? ' stacked' : '');
    // A card with quantity > 1 shows once with an "N×" badge, like Archidekt.
    list.forEach(c => stack.append(cardEl(c)));
    col.append(h, stack);
    board.append(col);
  }
}

// --- stats ---

function statRow(label, value, {bar, barClass} = {}) {
  const row = document.createElement('div');
  row.className = 'stat-row';
  const l = document.createElement('div');
  l.className = 'label';
  l.append(document.createTextNode(label));
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = value;
  row.append(l, num);
  if (bar !== undefined) {
    const b = document.createElement('div');
    b.className = 'bar' + (barClass ? ' ' + barClass : '');
    const fill = document.createElement('span');
    fill.style.width = Math.min(100, Math.round(bar * 100)) + '%';
    b.append(fill);
    row.append(b);
  }
  return row;
}

function statSection(title, rows) {
  const s = document.createElement('section');
  const h = document.createElement('h3');
  h.textContent = title;
  s.append(h, ...rows);
  return s;
}

// One line per question: a single stacked bar split by colour, with the counts
// as its legend — rather than a bar per colour, which had to be added up by eye.
function manaLine(title, counts, label) {
  const line = document.createElement('div');
  line.className = 'mana-line';
  const present = COLORS.filter(c => counts[c]);
  const total = present.reduce((n, c) => n + counts[c], 0);

  const head = document.createElement('div');
  head.className = 'head';
  const name = document.createElement('b');
  name.textContent = title;
  const sum = document.createElement('span');
  sum.textContent = `${total} ${label}`;
  head.append(name, sum);

  const bar = document.createElement('div');
  bar.className = 'mana-bar';
  const legend = document.createElement('div');
  legend.className = 'legend';
  for (const c of present) {
    const pct = Math.round(counts[c] / total * 100);
    const seg = document.createElement('span');
    seg.className = c;
    seg.style.width = counts[c] / total * 100 + '%';
    seg.title = `${c} ${counts[c]} (${pct}%)`;
    bar.append(seg);

    const item = document.createElement('span');
    const p = document.createElement('span');
    p.className = 'pip ' + c;
    p.textContent = c;
    const n = document.createElement('i');
    n.textContent = `${pct}%`;
    item.append(p, document.createTextNode(String(counts[c])), n);
    legend.append(item);
  }
  if (!present.length) legend.textContent = 'none';

  line.append(head, bar, legend);
  return line;
}

function renderStats(deck) {
  statsEl.innerHTML = '';
  const s = deck.stats || {};

  statsEl.append(statSection('Mana', [
    manaLine('Mana symbols', deck.mana_symbols || {}, 'pips'),
    manaLine('Mana production', deck.mana_production || {}, 'sources'),
  ]));

  // Command Zone template (see command_zone_template.md): under target is the
  // thing worth seeing, so colour the bar by that.
  statsEl.append(statSection('Template check', (s.template || []).map(t => statRow(
    t.label, `${t.count}/${t.target}`,
    {bar: t.count / t.target, barClass: t.count >= t.target ? 'ok' : 'warn'}))));

  const otags = Object.entries(s.otags || {}).sort((a, b) => b[1] - a[1]);
  const otagMax = otags.length ? otags[0][1] : 1;
  statsEl.append(statSection('Scryfall otags', otags.length
    ? otags.map(([tag, n]) => statRow(tag, n, {bar: n / otagMax}))
    : [statRow('no otag data', 0)]));

  const types = Object.entries(s.types || {});
  const typeMax = Math.max(1, ...types.map(([, n]) => n));
  statsEl.append(statSection('Card types', types.map(([t, n]) =>
    statRow(t, n, {bar: n / typeMax}))));

  const curve = Object.entries(s.curve || {});
  const curveMax = Math.max(1, ...curve.map(([, n]) => n));
  statsEl.append(statSection(`Mana curve — avg ${s.avg_cmc ?? '?'} CMC`,
    curve.map(([cmc, n]) => statRow(`${cmc} CMC`, n, {bar: n / curveMax}))));
}

// --- wants & trades ---

// A list of cards to look for and cards to give away, with no link to any deck.
// It lives in the Worker's KV store (see worker/index.js) rather than in the
// data bundle, because it's the one thing on the site that is edited from the
// phone instead of from a decklist. Reading is public; editing needs the
// password, which buys a signed token that's kept for a month.

const wantsEl = document.getElementById('wants');
const wantsBoard = document.getElementById('wants-board');
const wantsStatus = document.getElementById('wants-status');
const wantsForm = document.getElementById('wants-add');
const editBtn = document.getElementById('wants-edit');
const addBtn = document.getElementById('want-add');
const nameInput = document.getElementById('want-name');
const nameOptions = document.getElementById('want-names');
const countInput = document.getElementById('want-count');
const listInput = document.getElementById('want-list');
const noteInput = document.getElementById('want-note');
const unlockEl = document.getElementById('unlock');
const unlockForm = document.getElementById('unlock-form');
const unlockInput = document.getElementById('unlock-password');
const unlockError = document.getElementById('unlock-error');

const TOKEN_KEY = 'wants-token';
const LISTS = [['want', 'Wants', 'nothing on the wants list yet'],
               ['trade', 'For trade', 'nothing offered for trade yet']];

let token = localStorage.getItem(TOKEN_KEY) || '';
let editing = false;
let wants = [];
let wantsLoaded = false;

function setStatus(message, isError = false) {
  wantsStatus.textContent = message;
  wantsStatus.className = isError ? 'meta err' : 'meta';
}

function forgetToken() {
  token = '';
  localStorage.removeItem(TOKEN_KEY);
}

async function api(path, {method = 'GET', body} = {}) {
  const res = await fetch('/api' + path, {
    method,
    headers: {
      ...(body === undefined ? {} : {'content-type': 'application/json'}),
      ...(token ? {authorization: `Bearer ${token}`} : {}),
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  // A plain static server (npm run preview, the test suite) has no /api at all,
  // and answers with HTML — hence the guard rather than a bare res.json().
  let data = null;
  try { data = await res.json(); } catch { /* not JSON: fall through to the status */ }
  if (res.status === 401 && token) { forgetToken(); setEditing(false); }
  if (!res.ok) throw new Error(data?.error || `the list is unavailable (${res.status})`);
  return data;
}

function setEditing(on) {
  editing = on;
  editBtn.textContent = on ? 'Lock' : 'Edit';
  editBtn.classList.toggle('on', on);
  wantsForm.hidden = !on;
  renderWants();
}

function renderWants() {
  wantsBoard.innerHTML = '';
  for (const [list, title, emptyText] of LISTS) {
    const mine = wants.filter(i => i.list === list)
      .sort((a, b) => a.name.localeCompare(b.name));
    const col = document.createElement('section');
    col.className = 'cat';
    const h = document.createElement('h2');
    h.textContent = title + ' ';
    const n = document.createElement('span');
    n.textContent = `(${mine.reduce((sum, i) => sum + i.count, 0)})`;
    h.append(n);
    const stack = document.createElement('div');
    stack.className = 'stack' + (stackedEl.checked ? ' stacked' : '');
    for (const item of mine) {
      stack.append(cardEl(item, editing
        ? {onRemove: () => removeWant(item), onDrop: () => dropCopy(item)}
        : {}));
    }
    if (!mine.length) {
      const p = document.createElement('p');
      p.className = 'meta';
      p.textContent = emptyText;
      stack.append(p);
    }
    col.append(h, stack);
    wantsBoard.append(col);
  }
  const totals = LISTS.map(([list]) => wants.filter(i => i.list === list)
    .reduce((sum, i) => sum + i.count, 0));
  countEl.textContent = `${totals[0]} wanted · ${totals[1]} for trade`;
}

async function loadWants() {
  try {
    const data = await api('/wants');
    wants = data.items || [];
    wantsLoaded = true;
    setStatus('');
  } catch (err) {
    wants = [];
    setStatus(err.message, true);
  }
  renderWants();
}

// A token from a previous visit may have expired, or the password may have been
// changed since — ask before showing controls that would then fail.
async function checkSession() {
  if (!token) return setEditing(false);
  try {
    const {editing: ok} = await api('/session');
    if (!ok) forgetToken();
    setEditing(Boolean(ok));
  } catch {
    setEditing(false);
  }
}

async function showWants() {
  renderWants();
  if (wantsLoaded) return;
  await loadWants();
  await checkSession();
}

// --- editing ---

function openUnlock() {
  unlockError.textContent = '';
  unlockInput.value = '';
  unlockEl.classList.add('open');
  unlockInput.focus();
}

function closeUnlock() {
  unlockEl.classList.remove('open');
  editBtn.focus();
}

editBtn.onclick = () => {
  if (!editing) return openUnlock();
  forgetToken();
  setEditing(false);
  setStatus('locked');
};

unlockForm.onsubmit = async e => {
  e.preventDefault();
  unlockError.textContent = '';
  try {
    const data = await api('/session', {method: 'POST', body: {password: unlockInput.value}});
    token = data.token;
    localStorage.setItem(TOKEN_KEY, token);
    closeUnlock();
    setEditing(true);
    setStatus('editing unlocked');
  } catch (err) {
    unlockError.textContent = err.message;
    unlockInput.select();
  }
};

document.getElementById('unlock-cancel').onclick = closeUnlock;
unlockEl.onclick = e => { if (e.target === unlockEl) closeUnlock(); };

// The card's printing, art and price come from Scryfall at the moment it's
// added, so the list renders like the rest of the site without the Worker
// needing to talk to Scryfall itself. A card it can't find is still added by
// name — the list is more useful than the picture.
async function scryfall(path) {
  const res = await fetch('https://api.scryfall.com' + path);
  if (!res.ok) throw new Error(`Scryfall says ${res.status}`);
  return res.json();
}

function snapshot(sf, name) {
  if (!sf) return {name};
  const faces = sf.card_faces || [];
  const front = sf.image_uris ? sf : faces.find(f => f.image_uris) || {};
  return {
    name: sf.name || name,
    set: sf.set,
    number: sf.collector_number,
    mana_cost: sf.mana_cost || faces[0]?.mana_cost || '',
    type_line: sf.type_line || faces[0]?.type_line || '',
    oracle_text: sf.oracle_text
      || faces.map(f => f.oracle_text).filter(Boolean).join('\n//\n'),
    image: front.image_uris?.normal || null,
    price_eur: sf.prices?.eur || null,
    cmc: sf.cmc,
    scryfall_uri: sf.scryfall_uri,
  };
}

let suggestTimer = 0;

nameInput.oninput = () => {
  clearTimeout(suggestTimer);
  const query = nameInput.value.trim();
  if (query.length < 3) return;
  suggestTimer = setTimeout(async () => {
    let names = [];
    try {
      names = (await scryfall('/cards/autocomplete?q=' + encodeURIComponent(query))).data || [];
    } catch { return; }  // offline: the full name typed by hand still works
    nameOptions.innerHTML = '';
    for (const name of names) {
      const option = document.createElement('option');
      option.value = name;
      nameOptions.append(option);
    }
  }, 250);
};

wantsForm.onsubmit = async e => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) return;
  addBtn.disabled = true;
  setStatus(`looking up ${name}…`);
  let card = null;
  try {
    card = await scryfall('/cards/named?fuzzy=' + encodeURIComponent(name));
  } catch { /* unknown card or no network: add it by name */ }
  try {
    const {item, merged} = await api('/wants/items', {
      method: 'POST',
      body: {
        ...snapshot(card, name),
        list: listInput.value,
        count: Number(countInput.value) || 1,
        note: noteInput.value.trim(),
      },
    });
    wants = wants.filter(w => w.id !== item.id).concat(item);
    nameInput.value = '';
    noteInput.value = '';
    countInput.value = '1';
    setStatus(merged ? `${item.name} — now ${item.count}×` : `added ${item.name}`);
    renderWants();
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    addBtn.disabled = false;
  }
};

async function removeWant(item) {
  if (!confirm(`Remove ${item.name}?`)) return;
  try {
    await api('/wants/items/' + encodeURIComponent(item.id), {method: 'DELETE'});
    wants = wants.filter(w => w.id !== item.id);
    setStatus(`removed ${item.name}`);
    renderWants();
  } catch (err) {
    setStatus(err.message, true);
  }
}

async function dropCopy(item) {
  try {
    const {item: updated} = await api('/wants/items/' + encodeURIComponent(item.id),
      {method: 'PATCH', body: {count: item.count - 1}});
    wants = wants.map(w => w.id === updated.id ? updated : w);
    setStatus(`${updated.name} — now ${updated.count}×`);
    renderWants();
  } catch (err) {
    setStatus(err.message, true);
  }
}

// --- tabs + loading ---

let current = null;
let loadSeq = 0;
let tab = 'cards';

// What each pane currently holds, so switching tabs doesn't rebuild the board
// (which would lose the scroll position and every open card).
let rendered = {cards: null, stats: null};

function showTab(name) {
  tab = name;
  for (const [key, button] of Object.entries(tabs)) {
    button.setAttribute('aria-selected', String(key === name));
  }
  board.hidden = name !== 'cards';
  statsEl.hidden = name !== 'stats';
  wantsEl.hidden = name !== 'wants';
  // The deck picker, grouping and drafts say nothing about the wants list.
  for (const el of document.querySelectorAll('.deck-only')) el.hidden = name === 'wants';
  if (name === 'wants') {
    location.hash = 'wants';
    showWants();
    return;
  }
  if (current) {
    location.hash = current.slug;
    render(current);
  } else if (deckSel.value && !loadSeq) {
    // Opened straight on #wants: the deck view hasn't fetched anything yet.
    load(deckSel.value);
  }
}

function render(deck, force = false) {
  countEl.textContent = `${deck.total} cards`;
  const key = tab === 'cards'
    ? `${deck.slug}|${groupEl.value}|${stackedEl.checked}`
    : deck.slug;
  if (!force && rendered[tab] === key) return;
  rendered[tab] = key;
  if (tab === 'cards') renderCards(deck); else renderStats(deck);
}

function clearView() {
  board.innerHTML = '';
  statsEl.innerHTML = '';
  countEl.textContent = '';
  rendered = {cards: null, stats: null};
}

async function load(slug) {
  const seq = ++loadSeq;
  emptyEl.textContent = '';
  location.hash = slug;
  let deck;
  try {
    const res = await fetch(`data/${slug}.json`);
    if (!res.ok) throw new Error(res.status);
    deck = await res.json();
  } catch {
    if (seq !== loadSeq) return;
    current = null;  // don't let a toggle re-render the previous deck
    clearView();
    emptyEl.textContent = `No data for ${slug} — run build_site.py.`;
    return;
  }
  if (seq !== loadSeq) return;  // a newer load already won
  current = deck;
  render(current);
}

function fillDecks() {
  const visible = index.filter(d => draftsEl.checked || !d.draft);
  deckSel.innerHTML = '';
  for (const d of visible) {
    const o = document.createElement('option');
    o.value = d.slug;
    o.textContent = `${d.name} (${d.total})${d.draft ? ' — draft' : ''}`;
    deckSel.append(o);
  }
  return visible;
}

(async function init() {
  let meta;
  try {
    const res = await fetch('data/index.json');
    if (!res.ok) throw new Error(res.status);
    meta = await res.json();
  } catch {
    emptyEl.textContent = 'No deck index — run build_site.py.';
    return;
  }
  index = meta.decks;
  if (meta.type_order) TYPE_ORDER = meta.type_order;  // single source: build_site.py

  const wanted = decodeURIComponent(location.hash.slice(1));
  if (wanted && index.find(d => d.slug === wanted && d.draft)) draftsEl.checked = true;
  let visible = fillDecks();
  const start = visible.find(d => d.slug === wanted) || visible[0];
  deckSel.onchange = () => load(deckSel.value);
  for (const [name, button] of Object.entries(tabs)) button.onclick = () => showTab(name);
  // Layout toggles only need a re-render, not a refetch.
  stackedEl.onchange = groupEl.onchange = () =>
    tab === 'wants' ? renderWants() : current && render(current);

  if (start) deckSel.value = start.slug;
  // The wants list is its own view, so it opens even when no deck is built.
  if (wanted === 'wants') {
    showTab('wants');
  } else if (!start) {
    emptyEl.textContent = 'No decks built yet.';
  } else {
    showTab('cards');
    await load(start.slug);
  }
  draftsEl.onchange = () => {
    const selected = deckSel.value;
    visible = fillDecks();
    if (!visible.length) {
      current = null;
      clearView();
      emptyEl.textContent = 'No built decks — tick "drafts".';
      return;
    }
    deckSel.value = visible.find(d => d.slug === selected) ? selected : visible[0].slug;
    load(deckSel.value);
  };
  window.onhashchange = () => {
    const slug = decodeURIComponent(location.hash.slice(1));
    if (slug === 'wants') return showTab('wants');
    if (slug && index.find(d => d.slug === slug)) {
      if (tab === 'wants') showTab('cards');
      if (slug === deckSel.value) return;
      deckSel.value = slug;
      load(slug);
    }
  };
})();
</script>
</body>
</html>
