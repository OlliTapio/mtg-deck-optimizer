<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decks</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --line: #2c313b;
    --text: #e6e8ec;
    --muted: #939aa8;
    --accent: #8ab4f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  select, label { font: inherit; }
  select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  }
  .meta { color: var(--muted); }
  label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }

  main { padding: 16px; }
  .columns {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
    align-items: start;
  }
  .cat h2 {
    font-size: 13px; font-weight: 600; margin: 0 0 8px;
    padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .cat h2 span { color: var(--muted); font-weight: 400; }

  /* Stacked cards: only the title bar of each card shows until the last one. */
  .stack { position: relative; }
  .card { position: relative; display: block; }
  .card img {
    display: block; width: 100%; border-radius: 4.75% / 3.5%;
    background: #0d0f12;
  }
  /* A card is ~140% as tall as it is wide; overlapping by 112% leaves the
     name/mana line of every card visible, like Archidekt's stacked view. */
  .stack.stacked .card { margin-bottom: -112%; }
  .stack.stacked .card:last-child { margin-bottom: 0; }
  .card:hover { z-index: 3; }
  .card .qty {
    position: absolute; top: 4%; right: 5%;
    background: rgba(0,0,0,.82); color: #fff;
    border-radius: 10px; padding: 1px 7px; font-size: 12px; font-weight: 600;
  }
  .card .buy {
    position: absolute; top: 4%; left: 5%;
    background: rgba(200,120,20,.92); color: #fff;
    border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600;
  }
  .missing {
    aspect-ratio: 488 / 680; display: flex; align-items: center;
    justify-content: center; text-align: center; padding: 8px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--muted);
  }
  .grid-view .stack { display: grid; gap: 10px; }
  a { color: var(--accent); }
  #empty { color: var(--muted); }

  /* Bottom mana bar: pip count in mana costs + sources producing each colour. */
  footer {
    position: sticky; bottom: 0; z-index: 5;
    display: flex; gap: 28px; flex-wrap: wrap; align-items: center;
    padding: 8px 16px;
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .mana-group { display: flex; align-items: center; gap: 10px; }
  .mana-group > b { font-size: 12px; font-weight: 600; color: var(--muted); }
  .pip-stat { display: inline-flex; align-items: center; gap: 4px; }
  .pip-stat > span { font-variant-numeric: tabular-nums; }
  .pip-stat > i { color: var(--muted); font-style: normal; font-size: 12px; }
  .pip {
    width: 17px; height: 17px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #1a1a1a;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  }
  .pip.W { background: #f8f2dc; }
  .pip.U { background: #9fd4ee; }
  .pip.B { background: #b6aca8; }
  .pip.R { background: #f0a08a; }
  .pip.G { background: #98ccac; }
  .pip.C { background: #ccc2bf; }
</style>
</head>
<body>
<header>
  <h1>Decks</h1>
  <select id="deck"></select>
  <span class="meta" id="count"></span>
  <label>group
    <select id="group">
      <option value="type">type</option>
      <option value="category">category</option>
    </select>
  </label>
  <label><input type="checkbox" id="stacked" checked> stack</label>
  <label><input type="checkbox" id="drafts"> show drafts</label>
</header>
<main><div class="columns" id="board"></div><p id="empty"></p></main>
<footer id="mana"></footer>

<script>
const board = document.getElementById('board');
const deckSel = document.getElementById('deck');
const countEl = document.getElementById('count');
const stackedEl = document.getElementById('stacked');
const draftsEl = document.getElementById('drafts');
const groupEl = document.getElementById('group');
let index = [];

// Commander pinned first, Land last. Type groups keep the conventional
// Archidekt order; tag categories fall back to biggest-group-first.
const TYPE_ORDER = ['Commander', 'Creature', 'Planeswalker', 'Instant', 'Sorcery',
                    'Artifact', 'Enchantment', 'Battle', 'Other', 'Land'];

function groupKey(card, mode) {
  if (card.category === 'Commander') return 'Commander';
  return mode === 'type' ? (card.type || 'Other') : card.category;
}

function sortedGroups(cards, mode) {
  const groups = new Map();
  for (const c of cards) {
    const key = groupKey(c, mode);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  for (const list of groups.values()) {
    list.sort((a, b) => (a.cmc ?? 0) - (b.cmc ?? 0) || a.name.localeCompare(b.name));
  }
  const total = list => list.reduce((n, c) => n + c.count, 0);
  const rank = key => key === 'Commander' ? -1 : key === 'Land' ? 1 : 0;
  return [...groups.entries()].sort((a, b) => {
    if (rank(a[0]) !== rank(b[0])) return rank(a[0]) - rank(b[0]);
    if (mode === 'type') return TYPE_ORDER.indexOf(a[0]) - TYPE_ORDER.indexOf(b[0]);
    return total(b[1]) - total(a[1]) || a[0].localeCompare(b[0]);
  });
}

function cardEl(card) {
  const a = document.createElement('div');
  a.className = 'card';
  a.title = [card.name, card.mana_cost, card.type_line, card.oracle_text]
    .filter(Boolean).join('\n');
  if (card.image) {
    const img = document.createElement('img');
    img.src = card.image;
    img.alt = card.name;
    img.loading = 'lazy';
    a.append(img);
  } else {
    const d = document.createElement('div');
    d.className = 'missing';
    d.textContent = card.name;
    a.append(d);
  }
  if (card.count > 1) {
    const q = document.createElement('span');
    q.className = 'qty';
    q.textContent = card.count + '×';
    a.append(q);
  }
  if (card.buy) {
    const b = document.createElement('span');
    b.className = 'buy';
    b.textContent = 'buy';
    a.append(b);
  }
  return a;
}

const COLORS = ['W', 'U', 'B', 'R', 'G', 'C'];

// Coloured pips in mana costs. Hybrid/phyrexian symbols like {G/U} or {B/P}
// count once for each colour half, matching Archidekt's symbol count.
function pipCounts(cards) {
  const counts = {};
  for (const card of cards) {
    for (const sym of (card.mana_cost || '').match(/\{[^}]+\}/g) || []) {
      for (const part of sym.slice(1, -1).split('/')) {
        if (COLORS.includes(part) && part !== 'C') {
          counts[part] = (counts[part] || 0) + card.count;
        }
      }
    }
  }
  return counts;
}

// Sources of each colour: any permanent whose produced_mana includes it.
function productionCounts(cards) {
  const counts = {};
  for (const card of cards) {
    for (const m of card.produced_mana || []) {
      if (COLORS.includes(m)) counts[m] = (counts[m] || 0) + card.count;
    }
  }
  return counts;
}

function manaGroup(title, counts, totalLabel) {
  const wrap = document.createElement('div');
  wrap.className = 'mana-group';
  const label = document.createElement('b');
  label.textContent = title;
  wrap.append(label);
  const total = COLORS.reduce((n, c) => n + (counts[c] || 0), 0);
  for (const c of COLORS) {
    if (!counts[c]) continue;
    const stat = document.createElement('span');
    stat.className = 'pip-stat';
    stat.title = `${counts[c]} ${c} ${totalLabel}`;
    stat.innerHTML =
      `<span class="pip ${c}">${c}</span><span>${counts[c]}</span>` +
      `<i>${total ? Math.round((counts[c] / total) * 100) : 0}%</i>`;
    wrap.append(stat);
  }
  return wrap;
}

function renderMana(cards) {
  const foot = document.getElementById('mana');
  foot.innerHTML = '';
  foot.append(
    manaGroup('Mana symbols', pipCounts(cards), 'pips'),
    manaGroup('Mana production', productionCounts(cards), 'sources'),
  );
}

function render(deck) {
  board.innerHTML = '';
  countEl.textContent = `${deck.total} cards`;
  const cards = deck.commander ? [deck.commander, ...deck.cards] : deck.cards;
  renderMana(cards);
  for (const [cat, list] of sortedGroups(cards, groupEl.value)) {
    const col = document.createElement('section');
    col.className = 'cat';
    const h = document.createElement('h2');
    h.innerHTML = `${cat} <span>(${list.reduce((n, c) => n + c.count, 0)})</span>`;
    const stack = document.createElement('div');
    stack.className = 'stack' + (stackedEl.checked ? ' stacked' : '');
    // A quantity>1 card shows once with an "N×" badge, like Archidekt.
    list.forEach(c => stack.append(cardEl(c)));
    col.append(h, stack);
    board.append(col);
  }
}

let current = null;

async function load(slug) {
  document.getElementById('empty').textContent = '';
  location.hash = slug;
  const res = await fetch(`data/${slug}.json`);
  if (!res.ok) {
    document.getElementById('empty').textContent = `No data for ${slug} — run build_site.py.`;
    board.innerHTML = '';
    return;
  }
  current = await res.json();
  render(current);
}

function fillDecks() {
  const visible = index.filter(d => draftsEl.checked || !d.draft);
  deckSel.innerHTML = '';
  for (const d of visible) {
    const o = document.createElement('option');
    o.value = d.slug;
    o.textContent = `${d.name} (${d.total})${d.draft ? ' — draft' : ''}`;
    deckSel.append(o);
  }
  return visible;
}

(async function init() {
  index = (await (await fetch('data/index.json')).json()).decks;
  const wanted = decodeURIComponent(location.hash.slice(1));
  if (wanted && index.find(d => d.slug === wanted && d.draft)) draftsEl.checked = true;
  let visible = fillDecks();
  const start = visible.find(d => d.slug === wanted) || visible[0];
  if (!start) { document.getElementById('empty').textContent = 'No decks built yet.'; return; }
  deckSel.value = start.slug;
  await load(start.slug);

  deckSel.onchange = () => load(deckSel.value);
  // Layout toggles only need a re-render, not a refetch.
  stackedEl.onchange = groupEl.onchange = () => current && render(current);
  draftsEl.onchange = () => {
    const current = deckSel.value;
    visible = fillDecks();
    deckSel.value = visible.find(d => d.slug === current) ? current : visible[0].slug;
    load(deckSel.value);
  };
  window.onhashchange = () => {
    const slug = decodeURIComponent(location.hash.slice(1));
    if (slug && slug !== deckSel.value && index.find(d => d.slug === slug)) {
      deckSel.value = slug;
      load(slug);
    }
  };
})();
</script>
</body>
</html>
