name = "mtg-decks"
compatibility_date = "2026-06-22"
# The deck site itself is static — Cloudflare serves web/public directly and the
# script is never invoked for it. web/worker.js exists for the one thing assets
# can't do: the wants & trades list's /api/* routes.
main = "web/worker.js"

# The data bundle in web/public/data is generated by build_site.py and committed,
# the same way property-bot commits public/listings.json.
[assets]
directory = "./web/public"
binding = "ASSETS"
# Assets win over the script for every path that is a file; /api/* isn't, so it
# reaches the Worker either way. Spelled out because the whole API depends on it.
run_worker_first = ["/api/*"]
# Deck selection is a URL hash, so nothing needs server-side rewriting — and a
# real 404 for a missing data/<slug>.json is what the site's error path expects
# (the SPA fallback would answer 200 with index.html instead).
not_found_handling = "none"

# Custom domain. Wrangler creates the DNS record + cert on deploy; the otl.fi
# zone must live in the same Cloudflare account as this Worker.
[[routes]]
pattern = "decks.otl.fi"
custom_domain = true

# The wants & trades list. One key, one JSON value — see web/worker.js.
# Create it once, then paste the id here:
#     npx wrangler kv namespace create WANTS
[[kv_namespaces]]
binding = "WANTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Password for editing the list; reading it needs none. This is a share-with-a-
# trade-partner list, not a secret, and the password lives in git so a deploy
# from a fresh clone works. Treat it as a "don't edit my list by accident" lock,
# not as security — to keep it out of git, delete this block and run
#     npx wrangler secret put EDIT_PASSWORD
# which overrides the var of the same name.
[vars]
EDIT_PASSWORD = "sininenkollari0726"
