name = "mtg-decks"
compatibility_date = "2026-06-22"

# Static-assets-only Worker: no script, Cloudflare serves web/public directly.
# The data bundle in web/public/data is generated by build_site.py and committed,
# the same way property-bot commits public/listings.json.
[assets]
directory = "./web/public"
not_found_handling = "single-page-application"

# Custom domain (optional). Uncomment once you want it on the otl.fi zone —
# wrangler creates the DNS record + cert on deploy.
# [[routes]]
# pattern = "decks.otl.fi"
# custom_domain = true
