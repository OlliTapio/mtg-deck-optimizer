name = "mtg-decks"
compatibility_date = "2026-06-22"
# The deck site is still static: Cloudflare serves web/public and only runs this
# script for a request that matches no file, which in practice is /api/* — the
# wants & trades list. See worker/index.js.
main = "worker/index.js"

[assets]
directory = "./web/public"
binding = "ASSETS"
# Deck selection is a URL hash, so nothing needs server-side rewriting — and a
# real 404 for a missing data/<slug>.json is what the site's error path expects
# (the SPA fallback would answer 200 with index.html instead).
not_found_handling = "none"

# Storage for the wants & trades list — the deck data itself stays in git.
# Create it once and paste the id here:
#   npx wrangler kv namespace create WANTS
[[kv_namespaces]]
binding = "WANTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The edit password is a secret, not a var, so it never lands in git:
#   npx wrangler secret put EDIT_PASSWORD
# Locally, put it in .dev.vars (gitignored) — see .dev.vars.example.

# Custom domain. Wrangler creates the DNS record + cert on deploy; the otl.fi
# zone must live in the same Cloudflare account as this Worker.
[[routes]]
pattern = "decks.otl.fi"
custom_domain = true
